# AutoModpack configuration. Docs: https://moddedmc.wiki/en/project/automodpack/docs
# fetch and apply the pack during launch
update-selected-modpack-on-launch: true
self-updater: false
sync-automodpack-version: true
sync-versions: true
play-music: true
show-modpack-settings-button: true
# mod ids that keep loading from this instance's own mods folder
pinned-mod-ids: []
